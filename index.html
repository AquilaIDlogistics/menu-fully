<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Selecione o Sistema</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 92vw;
            max-width: 700px;
            text-align: center;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 40px;
        }

        .button {
            display: flex;

            width: 100%;
            min-height: 120px;

            margin: 20px 0;

            border: none;
            border-radius: 18px;

            font-size: 32px;
            font-weight: bold;

            color: white;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            box-shadow: 0 5px 14px rgba(0,0,0,0.18);

            -webkit-user-select: none;
            user-select: none;

            cursor: pointer;
        }

        .button:active {
            transform: scale(0.97);
        }

        .piramide {
            background: #1f5f99;
        }

        .equality {
            background: #248a55;
        }

        .loading {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #374151;
        }

        .footer {
            margin-top: 30px;
            font-size: 15px;
            color: #6b7280;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">
            SELECIONE O SISTEMA
        </div>

        <a
            class="button piramide"
            href="http://checklist.id-logistics.com.br/"
            onclick="abrirSistema(event, 'piramide')"
        >
            PIRÂMIDE DE SEGURANÇA
        </a>

        <a
            class="button equality"
            href="https://e-quality.id-logistics.com.br/index.php"
            onclick="abrirSistema(event, 'equality')"
        >
            E-QUALITY
        </a>

        <div id="loading" class="loading">
            Preparando sistema...
        </div>

        <div class="footer">
            Selecione uma opção para continuar
        </div>

    </div>


    <script>

        const PIRAMIDE =
            "http://checklist.id-logistics.com.br/";

        const EQUALITY =
            "https://e-quality.id-logistics.com.br/index.php";


        function abrirSistema(event, sistema) {

            event.preventDefault();

            const loading =
                document.getElementById("loading");

            loading.style.display = "block";


            let destino = "";

            if (sistema === "piramide") {
                destino = PIRAMIDE;
            }

            if (sistema === "equality") {
                destino = EQUALITY;
            }


            /*
             * Guarda somente qual sistema
             * o usuário escolheu.
             */

            try {
                localStorage.setItem(
                    "sistemaEscolhido",
                    sistema
                );

                localStorage.setItem(
                    "destinoSistema",
                    destino
                );

            } catch (erro) {

                console.log(
                    "Não foi possível salvar a escolha:",
                    erro
                );

            }


            /*
             * Se o Fully disponibilizar
             * restartApp(), tentamos reiniciar
             * o aplicativo.
             */

            if (
                typeof fully !== "undefined" &&
                typeof fully.restartApp === "function"
            ) {

                try {

                    fully.restartApp();

                    return;

                } catch (erro) {

                    console.log(
                        "restartApp não funcionou:",
                        erro
                    );

                }

            }


            /*
             * Caso restartApp não esteja disponível,
             * abrimos normalmente o sistema.
             */

            setTimeout(function () {

                window.location.href = destino;

            }, 500);

        }


        /*
         * Quando o GitHub Pages abrir novamente,
         * verifica se existe uma escolha pendente.
         */

        window.addEventListener(
            "load",
            function () {

                let sistema = null;

                let destino = null;


                try {

                    sistema =
                        localStorage.getItem(
                            "sistemaEscolhido"
                        );

                    destino =
                        localStorage.getItem(
                            "destinoSistema"
                        );

                } catch (erro) {

                    console.log(
                        "Erro ao ler escolha:",
                        erro
                    );

                }


                /*
                 * Se existe uma escolha pendente,
                 * abre o sistema.
                 */

                if (
                    sistema &&
                    destino
                ) {

                    /*
                     * Remove primeiro para evitar
                     * loop infinito após o restart.
                     */

                    try {

                        localStorage.removeItem(
                            "sistemaEscolhido"
                        );

                        localStorage.removeItem(
                            "destinoSistema"
                        );

                    } catch (erro) {

                        console.log(
                            "Erro ao limpar escolha:",
                            erro
                        );

                    }


                    setTimeout(function () {

                        window.location.href =
                            destino;

                    }, 1000);

                }

            }
        );

    </script>

</body>

</html>
