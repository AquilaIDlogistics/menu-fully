<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
maximum-scale=1.0,
user-scalable=no">

<title>Selecione o Sistema</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #f2f4f7;
    overflow: hidden;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    width: 92vw;
    max-width: 700px;
    text-align: center;
}

.title {
    font-size: 42px;
    font-weight: bold;
    color: #1f2937;
    margin-bottom: 40px;
}

.button {
    display: flex;

    width: 100%;
    min-height: 120px;

    margin: 20px 0;

    border: none;
    border-radius: 18px;

    font-size: 32px;
    font-weight: bold;

    color: white;

    align-items: center;
    justify-content: center;

    text-decoration: none;

    box-shadow: 0 5px 14px rgba(0,0,0,0.18);

    user-select: none;
}

.piramide {
    background: #1f5f99;
}

.equality {
    background: #248a55;
}

.button:active {
    transform: scale(0.97);
}

.footer {
    margin-top: 30px;
    font-size: 15px;
    color: #6b7280;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
SELECIONE O SISTEMA
</div>


<a
class="button piramide"
href="http://checklist.id-logistics.com.br/"
onclick="escolher('piramide')"
>
PIRÂMIDE DE SEGURANÇA
</a>


<a
class="button equality"
href="https://e-quality.id-logistics.com.br/index.php"
onclick="escolher('equality')"
>
E-QUALITY
</a>


<div class="footer">
Selecione uma opção para continuar
</div>

</div>


<script>

function escolher(sistema) {

    /*
     * GUARDA O SISTEMA ESCOLHIDO
     */

    document.cookie =
        "sistema=" +
        sistema +
        "; path=/";


    /*
     * REINICIA O FULLY
     */

    if (
        typeof fully !== "undefined" &&
        typeof fully.restartApp === "function"
    ) {

        fully.restartApp();

    }

}


/*
 * RECUPERA O SISTEMA
 */

function pegarSistema() {

    const cookies =
        document.cookie.split(";");

    for (let cookie of cookies) {

        cookie =
            cookie.trim();

        if (
            cookie.indexOf("sistema=") === 0
        ) {

            return cookie.substring(
                "sistema=".length
            );

        }

    }

    return null;

}


window.addEventListener(
    "load",
    function() {

        const sistema =
            pegarSistema();


        if (sistema === "piramide") {

            document.cookie =
                "sistema=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";

            window.location.replace(
                "http://checklist.id-logistics.com.br/"
            );

        }


        if (sistema === "equality") {

            document.cookie =
                "sistema=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/";

            window.location.replace(
                "https://e-quality.id-logistics.com.br/index.php"
            );

        }

    }

);

</script>

</body>

</html>
