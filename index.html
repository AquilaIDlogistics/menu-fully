<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Selecione o Sistema</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 35px;
            color: #222;
        }

        .botao {
            width: 100%;
            height: 70px;
            margin-bottom: 20px;

            border: none;
            border-radius: 10px;

            font-size: 22px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.2);
        }

        .piramide {
            background: #ffffff;
            color: #222;
        }

        .equality {
            background: #ffffff;
            color: #222;
        }

        .botao:active {
            transform: scale(0.98);
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>
            Selecione o sistema
        </h1>


        <button
            class="botao piramide"
            onclick="abrirPiramide()"
        >
            PIRÂMIDE
        </button>


        <button
            class="botao equality"
            onclick="abrirEquality()"
        >
            E-QUALITY
        </button>

    </div>


    <script>

        // ========================================================
        // PIRÂMIDE
        // ========================================================

        function abrirPiramide() {

            window.location.href =
                "https://checklist.id-logistics.com.br/";

        }


        // ========================================================
        // E-QUALITY
        // ========================================================

        function abrirEquality() {

            window.location.href =
                "https://e-quality.id-logistics.com.br/index.php";

        }

    </script>

</body>

</html>
