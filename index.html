<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Selecione o Sistema</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 92vw;
            max-width: 700px;
            text-align: center;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 40px;
        }

        .button {
            display: flex;
            width: 100%;
            min-height: 120px;
            margin: 20px 0;
            border: none;
            border-radius: 18px;
            font-size: 32px;
            font-weight: bold;
            color: white;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 5px 14px rgba(0,0,0,0.18);
            user-select: none;
            cursor: pointer;
        }

        .button:active {
            transform: scale(0.97);
        }

        .piramide {
            background: #1f5f99;
        }

        .equality {
            background: #248a55;
        }

        .loading {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #374151;
        }

        .footer {
            margin-top: 30px;
            font-size: 15px;
            color: #6b7280;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="title">
        SELECIONE O SISTEMA
    </div>

    <a
        class="button piramide"
        href="#"
        onclick="abrirSistema('http://checklist.id-logistics.com.br/')"
    >
        PIRÂMIDE DE SEGURANÇA
    </a>

    <a
        class="button equality"
        href="#"
        onclick="abrirSistema('https://e-quality.id-logistics.com.br/index.php')"
    >
        E-QUALITY
    </a>

    <div id="loading" class="loading">
        Abrindo sistema...
    </div>

    <div class="footer">
        Selecione uma opção para continuar
    </div>

</div>


<script>

function abrirSistema(url) {

    document.getElementById("loading").style.display = "block";


    /*
     * Cria um identificador único a cada clique.
     */

    const novoParametro =
        "_nova_sessao=" +
        Date.now();


    /*
     * Verifica se a URL já possui ?
     */

    let separador = "?";

    if (url.includes("?")) {
        separador = "&";
    }


    /*
     * Cria uma URL completamente nova.
     */

    const novaUrl =
        url +
        separador +
        novoParametro;


    /*
     * Tenta limpar somente o histórico
     * antes da nova navegação.
     */

    if (
        typeof fully !== "undefined" &&
        typeof fully.clearHistory === "function"
    ) {

        try {
            fully.clearHistory();
        } catch (e) {
            console.log(e);
        }

    }


    /*
     * Pequeno atraso para o WebView processar
     * a mudança antes de navegar.
     */

    setTimeout(function() {

        window.location.replace(novaUrl);

    }, 100);

}

</script>

</body>

</html>
