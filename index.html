<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Selecione o Sistema</title>

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f4f7;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 92vw;
            max-width: 700px;
            text-align: center;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 40px;
        }

        .button {
            display: flex;
            width: 100%;
            min-height: 120px;
            margin: 20px 0;

            border: none;
            border-radius: 18px;

            font-size: 32px;
            font-weight: bold;

            color: white;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            box-shadow: 0 5px 14px rgba(0,0,0,0.18);

            -webkit-user-select: none;
            user-select: none;

            cursor: pointer;
        }

        .button:active {
            transform: scale(0.97);
        }

        .piramide {
            background: #1f5f99;
        }

        .equality {
            background: #248a55;
        }

        .loading {
            display: none;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
            color: #374151;
        }

        .footer {
            margin-top: 30px;
            font-size: 15px;
            color: #6b7280;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="title">
        SELECIONE O SISTEMA
    </div>


    <a
        class="button piramide"
        href="#"
        onclick="escolherSistema('piramide')"
    >
        PIRÂMIDE DE SEGURANÇA
    </a>


    <a
        class="button equality"
        href="#"
        onclick="escolherSistema('equality')"
    >
        E-QUALITY
    </a>


    <div
        id="loading"
        class="loading"
    >
        Preparando sistema...
    </div>


    <div class="footer">
        Selecione uma opção para continuar
    </div>

</div>


<script>


/*
 * URLs dos sistemas
 */

const PIRAMIDE =
    "http://checklist.id-logistics.com.br/";

const EQUALITY =
    "https://e-quality.id-logistics.com.br/index.php";


/*
 * Chave usada para guardar temporariamente
 * o sistema escolhido.
 */

const CHAVE =
    "sistema_para_abrir";


/*
 * Quando o usuário escolhe um sistema.
 */

function escolherSistema(sistema) {

    const loading =
        document.getElementById("loading");

    loading.style.display = "block";


    /*
     * Guarda a escolha.
     */

    try {

        localStorage.setItem(
            CHAVE,
            sistema
        );

    } catch (erro) {

        console.log(
            "Erro ao salvar escolha:",
            erro
        );

    }


    /*
     * Se o Fully possui loadStartUrl(),
     * mandamos ele carregar novamente
     * a Start URL.
     */

    if (
        typeof fully !== "undefined" &&
        typeof fully.loadStartUrl === "function"
    ) {

        try {

            fully.loadStartUrl();

            return;

        } catch (erro) {

            console.log(
                "loadStartUrl falhou:",
                erro
            );

        }

    }


    /*
     * Fallback caso a API do Fully
     * não esteja disponível.
     */

    abrirSistemaEscolhido();

}


/*
 * Essa função é executada quando
 * o GitHub Pages carrega novamente.
 */

function abrirSistemaEscolhido() {

    let sistema = null;


    try {

        sistema =
            localStorage.getItem(CHAVE);

    } catch (erro) {

        console.log(
            "Erro lendo escolha:",
            erro
        );

    }


    /*
     * Não existe sistema pendente.
     * Então permanece na tela inicial.
     */

    if (!sistema) {
        return;
    }


    /*
     * IMPORTANTE:
     *
     * Apaga a escolha ANTES de abrir
     * o sistema para impedir loop.
     */

    try {

        localStorage.removeItem(CHAVE);

    } catch (erro) {

        console.log(
            "Erro removendo escolha:",
            erro
        );

    }


    let destino = null;


    if (sistema === "piramide") {

        destino = PIRAMIDE;

    }


    if (sistema === "equality") {

        destino = EQUALITY;

    }


    if (!destino) {
        return;
    }


    /*
     * Pequena espera para o WebView
     * terminar de carregar a página.
     */

    setTimeout(function() {

        window.location.replace(destino);

    }, 100);

}


/*
 * Executa quando a página termina
 * de carregar.
 */

window.addEventListener(
    "load",
    function() {

        abrirSistemaEscolhido();

    }
);


</script>

</body>

</html>
